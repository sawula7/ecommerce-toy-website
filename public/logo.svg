<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" width="220" height="60">
  <!-- House shape -->
  <polygon points="28,28 14,28 21,18" fill="#FF6B35"/>
  <rect x="14" y="28" width="28" height="20" rx="2" fill="#FF6B35"/>
  <!-- Door -->
  <rect x="22" y="34" width="8" height="14" rx="2" fill="#fff"/>
  <!-- Star on roof -->
  <polygon points="21,14 22.2,17.6 26,17.6 23,19.8 24.2,23.4 21,21.2 17.8,23.4 19,19.8 16,17.6 19.8,17.6" fill="#FFD700" transform="scale(0.7) translate(9, 4)"/>

  <!-- Text: toy -->
  <text x="48" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" fill="#FF6B35" letter-spacing="-0.5">toy</text>
  <!-- Text: house -->
  <text x="84" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" fill="#2D2D2D" letter-spacing="-0.5">house</text>
  <!-- TLD: .lk -->
  <text x="170" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#FF6B35">.lk</text>

  <!-- Decorative dot under toy -->
